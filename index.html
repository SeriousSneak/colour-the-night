<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colour The Night — Coming Soon</title>
  <meta name="description" content="A free music-synchronized residential light show in Winnipeg, Manitoba. New website coming soon." />

  <!-- Social share preview -->
  <meta property="og:title" content="Colour The Night — Coming Soon" />
  <meta property="og:description" content="A free music-synchronized light show in Winnipeg. New website coming soon." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink:        #0d1117;
      --slate:      #161b22;
      --rule:       #2d3748;
      --cream:      #f2efe9;
      --cream-dim:  #c8c2b8;
      --gold:       #b8922a;
      --gold-lt:    #d0a83c;
      --blush:      #c4a882;
      --f-display: 'Cormorant Garamond', Georgia, serif;
      --f-body:    'Jost', system-ui, sans-serif;
      --ease:   cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--ink);
      color: var(--cream);
      font-family: var(--f-body);
      font-weight: 400;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 3rem);
      overflow: hidden;
      position: relative;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Animated background glows ── */
    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-red {
      width: 50vw; height: 50vw;
      top: -10vw; left: -8vw;
      background: radial-gradient(circle, rgba(210,40,50,0.18) 0%, transparent 70%);
      animation: drift1 14s ease-in-out infinite;
    }
    .glow-green {
      width: 45vw; height: 45vw;
      bottom: -12vw; right: -6vw;
      background: radial-gradient(circle, rgba(30,160,80,0.16) 0%, transparent 70%);
      animation: drift2 17s ease-in-out infinite;
    }
    .glow-gold {
      width: 38vw; height: 38vw;
      top: 40%; left: 55%;
      background: radial-gradient(circle, rgba(184,146,42,0.14) 0%, transparent 70%);
      animation: drift3 20s ease-in-out infinite;
    }
    @keyframes drift1 {
      0%,100% { transform: translate(0,0) scale(1);    opacity: 0.7; }
      50%      { transform: translate(6vw,4vw) scale(1.15); opacity: 1; }
    }
    @keyframes drift2 {
      0%,100% { transform: translate(0,0) scale(1.1);  opacity: 0.6; }
      50%      { transform: translate(-5vw,-3vw) scale(1); opacity: 0.9; }
    }
    @keyframes drift3 {
      0%,100% { transform: translate(-50%,-50%) scale(1);   opacity: 0.5; }
      50%      { transform: translate(-54%,-46%) scale(1.2); opacity: 0.8; }
    }

    /* ── Twinkling star dots ── */
    .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: var(--cream);
      opacity: 0.5;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50%       { opacity: 0.8;  transform: scale(1.3); }
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: clamp(2.5rem, 7vw, 4.5rem) clamp(1.5rem, 6vw, 4rem);
      background: rgba(22, 27, 34, 0.55);
      border: 1px solid var(--rule);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: rise 0.9s var(--ease) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(184,146,42,0.4);
      padding: 0.4rem 1rem;
      margin-bottom: 2rem;
    }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }

    .brand {
      font-family: var(--f-display);
      font-weight: 300;
      font-size: clamp(2.8rem, 11vw, 5.5rem);
      line-height: 1.0;
      letter-spacing: 0.02em;
      margin-bottom: 1.5rem;
    }
    .brand .the { font-style: italic; color: var(--gold); display: block; font-size: 0.55em; margin: 0.15em 0; }

    .rule {
      width: 44px; height: 1px;
      background: var(--gold);
      margin: 0 auto 1.75rem;
      opacity: 0.6;
    }

    .headline {
      font-family: var(--f-display);
      font-weight: 400;
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      line-height: 1.25;
      margin-bottom: 1.25rem;
    }
    .headline em { font-style: italic; color: var(--gold); }

    .sub {
      font-size: clamp(0.95rem, 2.3vw, 1.05rem);
      color: var(--cream-dim);
      max-width: 440px;
      margin: 0 auto 2.5rem;
      line-height: 1.8;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cream-dim);
      margin-bottom: 2.5rem;
    }
    .meta .sep { color: var(--gold); }

    .yt-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--gold);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.9rem 1.9rem;
      transition: background 0.2s, transform 0.2s;
    }
    .yt-btn:hover { background: var(--gold-lt); transform: translateY(-2px); }
    .yt-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .footer-note {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: var(--cream-dim);
      letter-spacing: 0.04em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <!-- Background glows -->
  <div class="glow glow-red"></div>
  <div class="glow glow-green"></div>
  <div class="glow glow-gold"></div>

  <!-- Twinkling stars (generated by JS) -->
  <div class="stars" id="stars" aria-hidden="true"></div>

  <!-- Card -->
  <main class="card">
    <span class="badge"><span class="badge-dot"></span>New Site Coming Soon</span>

    <h1 class="brand">
      Colour
      <span class="the">The</span>
      Night
    </h1>

    <div class="rule"></div>

    <p class="headline">We're building something <em>brighter</em>.</p>
    <!--<p class="sub">Our brand-new website is on the way. In the meantime, the show goes on — a free, music-synchronized light show in Winnipeg, every Halloween and Christmas.</p>-->
    <p class="sub">Our brand-new website is on the way. I'm working to make it more visually appealing and changing where it is hosted. In the meantime, check out our YouTube channel!</p>

  <!--
    <div class="meta">
      <span>Winnipeg, MB</span>
      <span class="sep">·</span>
      <span>Free Admission</span>
      <span class="sep">·</span>
      <span>Halloween &amp; Christmas</span>
    </div>
  -->

    <a class="yt-btn" href="https://youtube.com/@ColourTheNightLightShow" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.75 15.5v-7l6.25 3.5-6.25 3.5z"/></svg>
      Watch on YouTube
    </a>

    <p class="footer-note">© 2026 Colour The Night</p>
  </main>

  <script>
    // Scatter twinkling stars
    (function () {
      var container = document.getElementById('stars');
      var count = 40;
      for (var i = 0; i < count; i++) {
        var s = document.createElement('span');
        s.className = 'star';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.top  = Math.random() * 100 + 'vh';
        s.style.animationDelay = (Math.random() * 3) + 's';
        s.style.animationDuration = (2 + Math.random() * 3) + 's';
        container.appendChild(s);
      }
    })();
  </script>

</body>
</html>
